[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "finantutor-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["strands-agents>=1.0", "bedrock-agentcore>=1.0.3", "boto3>=1.43.64", "python-dotenv>=1.0", "pydantic>=2.0"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.9"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
