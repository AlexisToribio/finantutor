[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "finantutor-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["boto3>=1.43.64", "pypdf>=5", "python-dotenv>=1.0"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
